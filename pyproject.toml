[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tainttrail"
version = "0.5.1"
description = "Local-first runtime security gateway for AI agents: Claude Code hooks and an MCP proxy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai-agents", "security", "mcp", "claude-code", "prompt-injection", "dlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    # Capped at the majors TaintTrail is tested on: fastmcp 4 / mcp 2 broke
    # gateway enforcement (first CI run, 2026-10-10). Raise only with a passing suite.
    "fastmcp>=3.0,<4",
    "mcp>=1.0,<2",
    "detect-secrets>=1.5",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.urls]
Homepage = "https://github.com/SRIJAICJ24/tainttrail"
Issues = "https://github.com/SRIJAICJ24/tainttrail/issues"
Security = "https://github.com/SRIJAICJ24/tainttrail/security/policy"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tainttrail = "tainttrail.cli:main"

[tool.setuptools.packages.find]
include = ["tainttrail*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
